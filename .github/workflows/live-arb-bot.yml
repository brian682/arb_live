name: Live Arb Bot 🔴

on:
  schedule:
    - cron: "* * * * *"   # every 1 minute
  workflow_dispatch:        # manual trigger

jobs:
  scan-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4      # kill if stuck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run Live Arb Scanner
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_PROFIT_PCT:   "0"      # alert on any arb (set "2" for 2%+ only)
          STAKE:            "1000"   # total stake in KES
        run: node index.js
