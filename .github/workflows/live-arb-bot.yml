name: Live Arb Bot 🔴

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  scan-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run Live Arb Scanner
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY:     ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY:     ${{ secrets.ODDS_API_KEY }}
          MIN_PROFIT_PCT:   "0"
          STAKE:            "1000"
        run: node index.js
